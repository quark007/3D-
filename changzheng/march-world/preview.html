<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>march-world 独立预览 · 长征·星火 A方场景</title>
<link rel="stylesheet" href="world.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23121713'/%3E%3Cpath d='M16 4.6l3.05 8.4h8.95l-7.25 5.25 2.77 8.5L16 21.5l-7.52 5.25 2.77-8.5L4 13h8.95z' fill='%23b8392f'/%3E%3C/svg%3E">
<script type="importmap">{"imports":{"three":"../assets/webgpu40/vendor/three/build/three.module.js","three/addons/":"../assets/webgpu40/vendor/three/jsm/"}}</script>
<style>
  body{margin:0;font:14px/1.6 system-ui,sans-serif;background:#202c29;color:#eee6d4;display:grid;grid-template-rows:auto 1fr auto;height:100dvh}
  header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:#26352f;border-bottom:1px solid #3a4a40}
  header select,header button{min-height:36px;padding:6px 12px;border:1px solid #bca87b80;background:#2c4436;color:#f5e9ce;border-radius:5px;font:inherit;cursor:pointer}
  header button:hover{background:#3d5745}
  #stage{position:relative;min-height:0}
  #world{position:absolute;inset:0}
  footer{display:grid;grid-template-columns:1fr auto;gap:10px;padding:8px 12px;background:#26352f;border-top:1px solid #3a4a40;font-size:13px}
  #log{max-height:96px;overflow:auto;background:#1a2420;border:1px solid #3a4a40;border-radius:5px;padding:6px 10px;grid-column:1/-1}
  #log p{margin:2px 0;color:#c8d2c0}
  #log p.evt{color:#e8c87a}
  #snap{color:#9fc0a8;white-space:pre}
</style>
</head>
<body>
<header>
  <strong>march-world 预览</strong>
  <select id="chapter"></select>
  <button id="mountBtn">挂载场景</button>
  <button id="pauseBtn">暂停/恢复(dialogue)</button>
  <button id="stateBtn">模拟 applyState</button>
  <button id="snapBtn">snapshot</button>
  <button id="destroyBtn">destroy</button>
  <span id="hint">WASD / 方向键移动 · Shift 冲刺 · C 切换慢走 · 按住 Alt 自由环视 · 空格跳跃 · E 交互 · 3D 点击锁定鼠标 / Esc 设置 · 右键拖动转视角 · Ctrl + 点击寻路</span>
</header>
<div id="stage"><div id="world" tabindex="-1"></div></div>
<footer>
  <span id="snap">snapshot: —</span>
  <span>A方模块 · 不启动小游戏/不写存档；交互仅以事件日志验证</span>
  <div id="log"></div>
</footer>
<script src="engine/projection.js"></script>
<script src="engine/painter.js"></script>
<script src="engine/pathfind.js"></script>
<script src="engine/input.js"></script>
<script src="engine/controls86.js"></script>
<script src="engine/player.js"></script>
<script src="engine/anchors.js"></script>
<script src="engine/ambient.js"></script>
<script src="engine/renderer.js"></script>
<script src="engine/actors3d.js"></script>
<script src="engine/assets3d.js"></script>
<script src="engine/street-life.js"></script>
<script src="engine/renderer3d.js"></script>
<script src="engine/view3d.js"></script>
<script src="scenes/kit.js"></script>
<script src="scenes/visual3d.js"></script>
<script src="scenes/chapter-01.js"></script>
<script src="scenes/chapter-02.js"></script>
<script src="scenes/chapter-03.js"></script>
<script src="scenes/chapter-04.js"></script>
<script src="scenes/chapter-05.js"></script>
<script src="scenes/chapter-06.js"></script>
<script src="scenes/chapter-07.js"></script>
<script src="scenes/chapter-08.js"></script>
<script src="scenes/chapter-09.js"></script>
<script src="scenes/chapter-10.js"></script>
<script src="scenes/chapter-11.js"></script>
<script src="scenes/chapter-12.js"></script>
<script src="world.js"></script>
<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const log = (msg, cls) => { const p = document.createElement('p'); if (cls) p.className = cls; p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`; $('log').prepend(p); };
  const sel = $('chapter');
  for (const s of window.CZMarchWorldManifest.scenes) {
    const o = document.createElement('option'); o.value = s.sceneId; o.textContent = `第${s.chapterId}章 · ${s.title}（${s.anchors.length}锚点）`; sel.append(o);
  }
  const requestedScene = new URLSearchParams(location.search).get('chapter');
  sel.value = [...sel.options].some(o => o.value === requestedScene) ? requestedScene : 'chapter-2/scene-xiangjiang';
  async function mount() {
    const scene = window.CZMarchWorldManifest.scenes.find(s => s.sceneId === sel.value);
    try {
      await window.CZMarchWorld.mount($('world'), { chapterId: scene.chapterId, sceneId: scene.sceneId, spawn: null, anchors: scene.anchors, playIntro: false });
      world.focus({ preventScroll: true });
      paused = false;
      log(`已挂载 ${scene.sceneId}（${scene.anchors.length} 锚点）`, 'evt');
    } catch (e) { log('挂载失败：' + e.message); }
  }
  $('mountBtn').onclick = mount;
  sel.onchange = mount;
  $('pauseBtn').onclick = () => {
    if (!window.CZMarchWorld.mounted) return log('未挂载');
    if (paused) { window.CZMarchWorld.resume('dialogue'); paused = false; log('resume(dialogue)'); }
    else { window.CZMarchWorld.pause('dialogue'); paused = true; log('pause(dialogue)：移动与交互应冻结', 'evt'); }
  };
  let paused = false;
  $('stateBtn').onclick = () => {
    const scene = window.CZMarchWorldManifest.scenes.find(s => s.sceneId === sel.value);
    const enabled = scene.anchors.filter((_, i) => i % 3 !== 0).map(a => a.anchorId);
    const completed = scene.anchors.filter((_, i) => i % 5 === 0).map(a => a.anchorId);
    window.CZMarchWorld.applyState({ enabledAnchorIds: enabled, completedAnchorIds: completed, openPassageIds: [] });
    log(`applyState：${enabled.length} 可用 / ${completed.length} 已完成（未列入的锚点应变暗）`, 'evt');
  };
  $('snapBtn').onclick = () => {
    try { const s = window.CZMarchWorld.snapshot(); $('snap').textContent = 'snapshot: ' + JSON.stringify(s); log('snapshot ✓'); }
    catch (e) { log('snapshot 报错（未挂载时属预期）：' + e.message); }
  };
  $('destroyBtn').onclick = () => { window.CZMarchWorld.destroy(); window.CZMarchWorld.destroy(); log('destroy ×2（幂等）✓', 'evt'); };
  window.addEventListener('czmarch:interact', ev => {
    log(`czmarch:interact → ${JSON.stringify(ev.detail)}`, 'evt');
  });
  mount();
})();
</script>
</body>
</html>
