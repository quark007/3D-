<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>EXP-01 · MNIST 手写样本锁</title>
<!--
  用法（主线密室/奖励房间 iframe 嵌入）：
    <iframe src="/minigames/mnist-lock.html?pwd=1936" width="100%" height="700" style="border:0" loading="lazy"></iframe>
  父页面监听通关信号：
    window.addEventListener('message', e => { if (e.data === 'mnist_success') { /* 解锁下一环节 */ } });
  密码定制：URL ?pwd=1234 或父页面注入 window.CZ_MNIST_PASSWORD（4 位数字，默认 1936）。
  本文件零外部依赖；识别为本地轻量推理（字体模板 + 余弦相似度），不需要后端。
-->
<style>
  :root{
    --bg0:#121418;--steel:#364254;
    --panel:rgba(22,27,34,.78);--panel2:rgba(28,34,43,.85);
    --line:rgba(120,150,190,.22);--line2:rgba(140,175,215,.4);
    --ink:#e6e8ec;--dim:#8a97a8;--faint:#5c6a7c;
    --accent:#a8cceb;--glow:rgba(140,180,220,.45);
    --ok:#7fd8cf;--bad:#c05b5b
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{
    background:radial-gradient(900px 460px at 50% -10%,#1a212b 0%,transparent 60%),var(--bg0);
    color:var(--ink);font-family:"JetBrains Mono","Cascadia Mono","SF Mono",Consolas,"Courier New","Microsoft YaHei",monospace;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    user-select:none;-webkit-user-select:none
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    background-size:140px 140px}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px),
      radial-gradient(120% 92% at 50% 40%,transparent 60%,rgba(0,0,0,.4) 100%)}
  .shell{width:min(430px,94vw);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 10px 34px rgba(0,0,0,.42);
    position:relative;z-index:1}
  .shell-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim);letter-spacing:.08em}
  .shell-head b{color:var(--accent);font-weight:600}
  .stage{padding:16px;position:relative}
  .corner{position:absolute;font-size:9.5px;color:var(--faint);letter-spacing:.12em}
  .corner.tl{top:6px;left:12px}.corner.br{bottom:6px;right:12px}
  .brief{font-size:10.5px;color:var(--dim);letter-spacing:.1em;margin-bottom:12px;line-height:1.9}
  .slots{display:flex;gap:10px;justify-content:center;margin-bottom:12px}
  .slot{width:42px;height:54px;border:1px solid var(--line);border-radius:6px;background:#0d1014;
    display:flex;align-items:center;justify-content:center;font-size:24px;color:#39434f;
    box-shadow:inset 0 0 12px rgba(0,0,0,.5)}
  .slot.cur{border-color:var(--line2);color:var(--accent);animation:breathe 2.4s ease-in-out infinite}
  .slot.done{color:var(--ink);border-color:rgba(127,216,207,.4);text-shadow:0 0 8px rgba(127,216,207,.35)}
  @keyframes breathe{0%,100%{box-shadow:inset 0 0 12px rgba(0,0,0,.5),0 0 0 rgba(140,180,220,0)}50%{box-shadow:inset 0 0 12px rgba(0,0,0,.5),0 0 10px rgba(140,180,220,.22)}}
  .padWrap{position:relative;background:#0d1014;border:1px solid var(--line);border-radius:6px;padding:8px;
    box-shadow:inset 0 0 22px rgba(0,0,0,.45)}
  canvas{display:block;width:min(272px,78vw);height:auto;margin:0 auto;border-radius:3px;cursor:crosshair;touch-action:none}
  .hint{color:var(--dim);font-size:11px;margin-top:12px;min-height:16px;text-align:center;letter-spacing:.08em;transition:color .5s ease}
  .hint::before{content:"» ";color:var(--faint)}
  .hint.bad{color:var(--bad)} .hint.ok{color:var(--ok)}
  .tools{display:flex;gap:10px;justify-content:center;margin-top:12px}
  button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;color:var(--ink);
    font-family:inherit;font-size:13px;letter-spacing:.14em;padding:11px 22px;cursor:pointer;touch-action:manipulation;
    transition:border-color .45s ease,background .45s ease,transform .12s ease,box-shadow .5s ease}
  button:hover{border-color:var(--line2);background:linear-gradient(180deg,rgba(50,62,78,.5),rgba(30,37,47,.5))}
  button:active{transform:scale(.97);box-shadow:0 0 10px var(--glow)}
  button.primary{border-color:var(--line2);color:var(--accent)}
  button:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
  .shell-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .sbtn{flex:1;text-align:center;background:transparent;border:1px solid var(--line);border-radius:6px;
    color:var(--dim);font-family:inherit;font-size:11px;letter-spacing:.14em;padding:9px 0;cursor:pointer;
    text-decoration:none;transition:border-color .45s ease,color .45s ease}
  .sbtn:hover{border-color:var(--line2);color:var(--accent)}
  .overlay{position:fixed;inset:0;background:rgba(10,12,16,.78);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:9}
  .overlay.show{display:flex}
  .win{width:min(320px,86vw);background:rgba(20,24,30,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(127,216,207,.4);border-radius:8px;padding:26px 28px;text-align:center;
    box-shadow:0 0 22px rgba(127,216,207,.12);animation:fadein .6s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .win h2{color:var(--ok);font-size:15px;letter-spacing:.35em;text-indent:.35em;font-weight:600;margin-bottom:8px}
  .win p{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-bottom:18px}
  .win button{background:transparent}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="../march-story/frame-report.js?v=8e3f525cf5eb53e3"></script>
</head>
<body>
<div class="shell">
  <div class="shell-head"><span><b>EXP-01</b> · MNIST 手写样本锁</span><span id="sampleTag">SAMPLE</span></div>
  <div class="stage">
    <span class="corner tl">SMP-28×28</span><span class="corner br">INPUT·INK</span>
    <p class="brief">依次手写 4 位密码 · 写大一些、写在框中央更容易识别</p>
    <div class="slots" id="slots"></div>
    <div class="padWrap"><canvas id="pad" width="280" height="280"></canvas></div>
    <div class="hint" id="hint">请书写第 1 位数字，然后点击「识别这一位」</div>
    <div class="tools">
      <button id="clear">清 除</button>
      <button id="ok" class="primary">识别这一位</button>
    </div>
  </div>
  <div class="shell-foot">
    <button class="sbtn" id="resetAll">重置实验</button>
    <a class="sbtn" id="backLab" href="index.html">返回档案室</a>
    <button class="sbtn" id="helpBtn">帮助</button>
  </div>
</div>
<div class="overlay" id="overlay"><div class="win"><h2>SAMPLE ARCHIVED</h2><p>四位样本全部核对无误 · 锁已开启 · 已通知主线</p><button id="again">重新实验</button></div></div>
<script>
'use strict';
/* 手写数字密码锁：280×280 画板 + 内置轻量识别（零依赖、纯本地）。
   识别管线仿 MNIST 预处理：裁剪笔迹 → 等比缩放至 20px → 28×28 居中 → 灰度反转归一 → 7×7 特征 →
   与内置模板做余弦相似度。模板在启动时用同一管线从字体字形现场生成，保证与玩家输入完全同构。 */
const KEY='mnist_success';
const qs=new URLSearchParams(location.search);
const PWD=String(window.CZ_MNIST_PASSWORD||qs.get('pwd')||'1936').replace(/\D/g,'').padEnd(4,'0').slice(0,4);
document.getElementById('sampleTag').textContent='SAMPLE-'+PWD;

const cv=document.getElementById('pad'),ctx=cv.getContext('2d',{willReadFrequently:true});
function resetPad(){ctx.fillStyle='#0b0e0a';ctx.fillRect(0,0,280,280);}
resetPad();
let drawing=false,last=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*280/r.width,y:(e.clientY-r.top)*280/r.height};}
function stroke(a,b){ctx.strokeStyle='#e6e8ec';ctx.lineWidth=17;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
function dot(p){ctx.fillStyle='#e6e8ec';ctx.beginPath();ctx.arc(p.x,p.y,8.5,0,7);ctx.fill();}
cv.addEventListener('pointerdown',e=>{drawing=true;last=pos(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}dot(last);e.preventDefault();});
cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);stroke(last,p);last=p;e.preventDefault();});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{drawing=false;}));

/* —— 识别管线 —— */
function blur(g){ // 28×28 双向三点箱式模糊，抑制手抖断笔
  const t=new Float32Array(784),o=new Float32Array(784);
  for(let y=0;y<28;y++)for(let x=0;x<28;x++){let s=0;for(let k=-1;k<=1;k++)s+=g[y*28+Math.min(27,Math.max(0,x+k))];t[y*28+x]=s/3;}
  for(let y=0;y<28;y++)for(let x=0;x<28;x++){let s=0;for(let k=-1;k<=1;k++)s+=t[Math.min(27,Math.max(0,y+k))*28+x];o[y*28+x]=s/3;}
  return o;
}
function feat(g){ // 7×7 块均值 → 单位向量（49 维）
  const v=new Float32Array(49);let n=0;
  for(let by=0;by<7;by++)for(let bx=0;bx<7;bx++){let s=0;for(let y=0;y<4;y++)for(let x=0;x<4;x++)s+=g[(by*4+y)*28+bx*4+x];v[by*7+bx]=s/16;}
  for(let i=0;i<49;i++)n+=v[i]*v[i];n=Math.sqrt(n)||1;
  for(let i=0;i<49;i++)v[i]/=n;return v;
}
function extract(srcCanvas){ // 任意画布 → 28×28 墨迹浮点图（MNIST 式：黑底白字、居中、20px 等比）
  const w0=srcCanvas.width,h0=srcCanvas.height;
  const img=srcCanvas.getContext('2d').getImageData(0,0,w0,h0).data;
  const lum=new Float32Array(w0*h0);let max=0;
  for(let i=0;i<w0*h0;i++){const l=.299*img[i*4]+.587*img[i*4+1]+.114*img[i*4+2];lum[i]=l;if(l>max)max=l;}
  const thr=Math.max(60,max*.35);let minX=w0,minY=h0,maxX=-1,maxY=-1,count=0;
  for(let y=0;y<h0;y++)for(let x=0;x<w0;x++)if(lum[y*w0+x]>thr){count++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}
  if(maxX<0||count<40)return null;
  const w=maxX-minX+1,h=maxY-minY+1,s=20/Math.max(w,h),sw=Math.max(1,Math.round(w*s)),sh=Math.max(1,Math.round(h*s));
  const t=document.createElement('canvas');t.width=28;t.height=28;const tc=t.getContext('2d');
  tc.fillStyle='#0b0e0a';tc.fillRect(0,0,28,28);
  tc.drawImage(srcCanvas,minX,minY,w,h,(28-sw)/2,(28-sh)/2,sw,sh); // 缩放过程天然完成灰度重采样
  const d=tc.getImageData(0,0,28,28).data,g=new Float32Array(784);
  for(let i=0;i<784;i++){const l=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];g[i]=Math.max(0,Math.min(1,(l-45)/160));} // 灰度反转+归一
  return blur(g);
}
const TEMPLATES=[];
(function buildTemplates(){ // 用三种字体字形现场生成 0-9 模板（与玩家输入同管线）
  const fonts=['bold 200px Arial,"Microsoft YaHei",sans-serif','bold 190px Georgia,serif','bold 185px Consolas,monospace'];
  for(const f of fonts){
    const c=document.createElement('canvas');c.width=280;c.height=280;const cc=c.getContext('2d');
    for(let d=0;d<=9;d++){
      cc.fillStyle='#0b0e0a';cc.fillRect(0,0,280,280);
      cc.fillStyle='#e6e8ec';cc.font=f;cc.textAlign='center';cc.textBaseline='middle';
      cc.fillText(String(d),140,152);
      const g=extract(c);if(g)TEMPLATES.push({d,v:feat(g)});
    }
  }
})();
function recognize(){
  const g=extract(cv);if(!g)return null;
  const v=feat(g);let best=-1,bd=-1;
  for(const t of TEMPLATES){let s=0;for(let i=0;i<49;i++)s+=v[i]*t.v[i];if(s>bd){bd=s;best=t.d;}}
  return{digit:best,conf:bd};
}

/* —— 游戏流程 —— */
const hintEl=document.getElementById('hint'),slotsEl=document.getElementById('slots'),overlay=document.getElementById('overlay');
let idx=0;const unlocked=[];
function hint(t,c){hintEl.textContent=t;hintEl.className='hint'+(c?' '+c:'');}
function renderSlots(){
  slotsEl.replaceChildren();
  for(let i=0;i<4;i++){
    const s=document.createElement('div');s.className='slot'+(i<idx?' done':i===idx?' cur':'');
    s.textContent=i<idx?unlocked[i]:'_';slotsEl.append(s);
  }
}
function accept(d){ // 当前位命中：解锁并推进
  unlocked.push(d);idx++;resetPad();
  if(idx>=4){renderSlots();hint('四位密码全部正确','ok');win();}
  else{renderSlots();hint('第 '+idx+' 位解锁 · 识别为 '+d+'，请写第 '+(idx+1)+' 位','ok');}
}
document.getElementById('ok').addEventListener('click',()=>{
  if(idx>=4)return;
  const r=recognize();
  if(!r){hint('没有检测到笔迹，请先书写','bad');return;}
  if(r.conf<0.68){hint('笔迹太潦草，认不出是哪个数字 · 请重写','bad');resetPad();return;}
  if(r.digit===+PWD[idx])accept(r.digit);
  else{hint('识别为 '+r.digit+'，不是当前位需要的数字 · 请重写','bad');resetPad();}
});
document.getElementById('clear').addEventListener('click',()=>{resetPad();hint(idx>=4?'已通关':'已清空，继续书写第 '+(idx+1)+' 位');});
window.addEventListener('keydown',e=>{ // 无障碍辅助通道：PC 键盘直输
  if(!/^[0-9]$/.test(e.key)||idx>=4)return;
  if(+e.key===+PWD[idx])accept(+e.key);else{hint('辅助输入 '+e.key+' 与当前位不符','bad');resetPad();}
});
function win(){overlay.classList.add('show');try{window.CZMarchFrameReport(KEY);}catch(_){}}
function resetAll(){idx=0;unlocked.length=0;resetPad();renderSlots();hint('实验已重置 · 请书写第 1 位数字');overlay.classList.remove('show');}
document.getElementById('resetAll').addEventListener('click',resetAll);
document.getElementById('again').addEventListener('click',resetAll);
document.getElementById('helpBtn').addEventListener('click',()=>hint('在框内写当前位数字 → 识别；识别正确的位自动解锁'));
if(window.parent!==window)document.getElementById('backLab').remove(); // iframe 内由父页面控制导航
renderSlots();
/* 自动化/父页面测试钩子：不影响正常玩法 */
window.__czTest={win,recognizeDigit:()=>{const r=recognize();return r?r.digit:-1;},resetAll};
</script>
</body>
</html>
