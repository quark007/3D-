<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>储物间 · 推箱子</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e11;color:#dfe7ee;font:14px/1.6 system-ui,'Microsoft YaHei',sans-serif;-webkit-tap-highlight-color:transparent}
  .shell{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;padding:10px 12px;box-sizing:border-box}
  .hd{font-size:12px;letter-spacing:.18em;color:#7c8b99;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
  .hd b{color:#dfe7ee;font-size:14px;letter-spacing:.08em}
  .board-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;margin:10px 0}
  #board{display:grid;gap:3px;background:#11161b;border:1px solid #2a3440;border-radius:4px;padding:8px;touch-action:manipulation}
  .cell{width:min(11vw,52px);height:min(11vw,52px);border-radius:3px;background:#141a20;box-shadow:inset 0 0 0 1px #1c242c}
  .cell.wall{background:#222c36;box-shadow:inset 0 0 0 1px #2f3b47}
  .cell.goal{box-shadow:inset 0 0 0 1px #35505a;background:#12202a}
  .cell.goal::after{content:'';display:block;width:26%;height:26%;margin:37%;border-radius:50%;background:rgba(127,212,196,.35)}
  .box{background:#3a4652 !important;box-shadow:inset 0 0 0 2px #4d5c6b !important;display:flex;align-items:center;justify-content:center;color:#9fb0bf;font-size:11px}
  .box.on{background:#1f3a35 !important;box-shadow:inset 0 0 0 2px rgba(127,212,196,.6) !important}
  .me{background:#2a3440 !important;box-shadow:inset 0 0 0 2px rgba(223,231,238,.65) !important}
  .ctrl{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center;margin-bottom:8px}
  .ctrl button{height:52px;font-size:18px;background:transparent;color:#dfe7ee;border:1px solid #3a4652;border-radius:4px;cursor:pointer}
  .ctrl button:active{background:#1a2129;transform:scale(.97)}
  .ops{display:flex;gap:10px;justify-content:center}
  .ops button{flex:1;max-width:170px;height:44px;background:transparent;color:#dfe7ee;border:1px solid #3a4652;border-radius:4px;cursor:pointer;letter-spacing:.06em}
  .ops button:hover{border-color:#7fd4c4;box-shadow:0 0 10px rgba(127,212,196,.15)}
  .win{position:fixed;inset:0;background:rgba(5,8,10,.82);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;opacity:0;pointer-events:none;transition:opacity .5s}
  .win.on{opacity:1;pointer-events:auto}
  .win .glow{color:#9fdcc8;text-shadow:0 0 18px rgba(127,212,196,.5);font-size:19px;letter-spacing:.12em}
  .win p{margin:0;color:#9fb0bf;font-size:13px;max-width:300px;text-align:center}
  .steps{color:#7c8b99;font-size:12px;text-align:center;margin:4px 0}
  @media(max-height:640px){.cell{width:min(9vw,44px);height:min(9vw,44px)}}
</style><script src="../march-story/frame-report.js?v=8e3f525cf5eb53e3"></script>
</head>
<body>
<div class="shell">
  <div class="hd"><b>储物间 · 推箱子</b><span>STORAGE · SOKOBAN</span></div>
  <div class="board-wrap"><div id="board"></div></div>
  <div class="steps" id="steps">步数 0</div>
  <div class="ctrl">
    <button data-m="up">↑</button><button data-m="up" style="visibility:hidden"></button><button data-m="down">↓</button>
    <button data-m="left">←</button><button data-m="down" style="visibility:hidden"></button><button data-m="right">→</button>
  </div>
  <div class="ops"><button id="reset">重置</button><button id="back">返回主房间</button></div>
</div>
<div class="win" id="win"><div class="glow">暗格开启</div><p>最后一只木箱归位。暗格里的东西，被保存得很好。</p><button id="take" style="height:44px;padding:0 26px;background:transparent;color:#9fdcc8;border:1px solid rgba(127,212,196,.5);border-radius:4px;cursor:pointer">取走暗格之物</button></div>
<script>
(function(){
  /* 关卡：#墙 .地 *目标 $箱 @人。已验证可解：A箱上推入上目标，B箱左推再下推入下目标。 */
  const LEVEL=[
    '######',
    '#..*.#',
    '#.$..#',
    '#.@$.#',
    '#...*#',
    '######'
  ];
  let grid,me,boxes,steps,done;
  function parse(){
    grid=[];boxes=[];steps=0;done=false;
    LEVEL.forEach((row,y)=>{grid[y]=[];
      [...row].forEach((ch,x)=>{
        grid[y][x]=ch==='#'?'wall':(ch==='*'?'goal':'.');
        if(ch==='$')boxes.push({x,y});
        if(ch==='@')me={x,y};
      });});
  }
  function at(x,y){return (grid[y]&&grid[y][x])||'wall';}
  function draw(){
    const b=document.getElementById('board');
    b.style.gridTemplateColumns='repeat('+LEVEL[0].length+',auto)';
    b.innerHTML='';
    for(let y=0;y<LEVEL.length;y++)for(let x=0;x<LEVEL[0].length;x++){
      const d=document.createElement('div');
      d.className='cell '+at(x,y);
      const box=boxes.find(o=>o.x===x&&o.y===y);
      if(box){d.classList.add('box');if(at(x,y)==='goal')d.classList.add('on');}
      if(me.x===x&&me.y===y)d.classList.add('me');
      b.append(d);
    }
    document.getElementById('steps').textContent='步数 '+steps;
  }
  function move(dx,dy){
    if(done)return;
    const nx=me.x+dx,ny=me.y+dy;
    if(at(nx,ny)==='wall')return;
    const box=boxes.find(o=>o.x===nx&&o.y===ny);
    if(box){
      const bx=nx+dx,by=ny+dy;
      if(at(bx,by)==='wall'||boxes.some(o=>o.x===bx&&o.y===by))return;
      box.x=bx;box.y=by;
    }
    me.x=nx;me.y=ny;steps++;
    draw();
    if(boxes.every(o=>at(o.x,o.y)==='goal')){
      done=true;
      setTimeout(()=>{document.getElementById('win').classList.add('on');
        try{window.CZMarchFrameReport('sokoban_success');}catch(e){}
      },350);
    }
  }
  document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{
    const m=b.dataset.m;
    move(m==='left'?-1:m==='right'?1:0,m==='up'?-1:m==='down'?1:0);
  }));
  document.getElementById('reset').onclick=()=>{document.getElementById('win').classList.remove('on');parse();draw();};
  document.getElementById('back').onclick=()=>{try{window.CZMarchFrameReport('sokoban_close');}catch(e){}};
  document.getElementById('take').onclick=()=>{try{window.CZMarchFrameReport('sokoban_success');}catch(e){}try{window.CZMarchFrameReport('sokoban_close');}catch(e){}};
  window.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    if(k==='arrowup'||k==='w')move(0,-1);
    else if(k==='arrowdown'||k==='s')move(0,1);
    else if(k==='arrowleft'||k==='a')move(-1,0);
    else if(k==='arrowright'||k==='d')move(1,0);
  });
  /* 自动化钩子（与五款小游戏同款约定） */
  window.__czTest={win(){boxes.forEach((o,i)=>{const g=goalAt(i);o.x=g.x;o.y=g.y;});draw();done=true;setTimeout(()=>{document.getElementById('win').classList.add('on');try{window.CZMarchFrameReport('sokoban_success');}catch(e){}},200);},
    steps:()=>steps};
  function goalAt(i){let n=0;for(let y=0;y<LEVEL.length;y++)for(let x=0;x<LEVEL[0].length;x++)if(at(x,y)==='goal'){if(n===i)return{x,y};n++;}return{x:1,y:1};}
  parse();draw();
})();
</script></body></html>
