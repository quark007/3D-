<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>EXP-03 · 对弈终端</title>
<!--
  用法（NPC 彩蛋房间 iframe 嵌入）：
    <iframe src="/minigames/tic-tac-toe.html" width="100%" height="640" style="border:0" loading="lazy"></iframe>
  父页面监听通关信号（仅玩家获胜时发送）：
    window.addEventListener('message', e => { if (e.data === 'tictac_success') { /* 彩蛋奖励 */ } });
  本文件零外部依赖。
-->
<style>
  :root{
    --bg0:#121418;--steel:#364254;
    --panel:rgba(22,27,34,.78);--panel2:rgba(28,34,43,.85);
    --line:rgba(120,150,190,.22);--line2:rgba(140,175,215,.4);
    --ink:#e6e8ec;--dim:#8a97a8;--faint:#5c6a7c;
    --accent:#a8cceb;--glow:rgba(140,180,220,.45);
    --ok:#7fd8cf;--bad:#c05b5b;--opp:#7f95ad
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:dark}
  body{
    background:radial-gradient(900px 460px at 50% -10%,#1a212b 0%,transparent 60%),var(--bg0);
    color:var(--ink);font-family:"JetBrains Mono","Cascadia Mono","SF Mono",Consolas,"Courier New","Microsoft YaHei",monospace;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:14px calc(14px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) calc(14px + env(safe-area-inset-left));
    user-select:none;-webkit-user-select:none
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
    background-size:140px 140px}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px),
      radial-gradient(120% 92% at 50% 40%,transparent 60%,rgba(0,0,0,.4) 100%)}
  .shell{width:min(420px,94vw);background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 10px 34px rgba(0,0,0,.42);
    position:relative;z-index:1}
  .shell-head{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:10px 14px;border-bottom:1px solid var(--line);font-size:11px;color:var(--dim);letter-spacing:.08em}
  .shell-head b{color:var(--accent);font-weight:600}
  .stage{padding:16px;position:relative}
  .corner{position:absolute;font-size:9.5px;color:var(--faint);letter-spacing:.12em}
  .corner.tl{top:6px;left:12px}.corner.br{bottom:6px;right:12px}
  .brief{font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-align:center;margin-bottom:12px}
  .status{min-height:18px;font-size:11px;color:var(--dim);text-align:center;letter-spacing:.12em;margin-bottom:12px;transition:color .5s ease}
  .status::before{content:"» ";color:var(--faint)}
  .status.win{color:var(--ok)} .status.lose{color:var(--bad)}
  .board{display:grid;grid-template-columns:repeat(3,min(23vw,88px));gap:8px;justify-content:center}
  .cell{aspect-ratio:1;background:#10141a;border:1px solid var(--line);border-radius:6px;
    font-size:clamp(28px,8vw,40px);color:var(--accent);font-family:inherit;
    display:flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;
    text-shadow:0 0 12px var(--glow);box-shadow:inset 0 0 14px rgba(0,0,0,.4);
    transition:border-color .45s ease,transform .12s ease}
  .cell:hover:enabled{border-color:var(--line2)}
  .cell:active:enabled{transform:scale(.97)}
  .cell:disabled{cursor:default}
  .cell.o{color:var(--opp);text-shadow:0 0 10px rgba(127,149,173,.3)}
  .cell.hl{border-color:rgba(127,216,207,.5);animation:cellGlow 2.4s ease-in-out infinite}
  @keyframes cellGlow{0%,100%{box-shadow:inset 0 0 14px rgba(0,0,0,.4),0 0 4px rgba(127,216,207,.15)}50%{box-shadow:inset 0 0 14px rgba(0,0,0,.4),0 0 14px rgba(127,216,207,.4)}}
  .shell-foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
  .sbtn{flex:1;text-align:center;background:transparent;border:1px solid var(--line);border-radius:6px;
    color:var(--dim);font-family:inherit;font-size:11px;letter-spacing:.14em;padding:9px 0;cursor:pointer;
    text-decoration:none;transition:border-color .45s ease,color .45s ease}
  .sbtn:hover{border-color:var(--line2);color:var(--accent)}
  .overlay{position:fixed;inset:0;background:rgba(10,12,16,.78);backdrop-filter:blur(3px);
    display:none;align-items:center;justify-content:center;z-index:9}
  .overlay.show{display:flex}
  .win{width:min(320px,86vw);background:rgba(20,24,30,.82);backdrop-filter:blur(8px);
    border:1px solid rgba(127,216,207,.4);border-radius:8px;padding:26px 28px;text-align:center;
    box-shadow:0 0 22px rgba(127,216,207,.12);animation:fadein .6s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .win h2{color:var(--ok);font-size:15px;letter-spacing:.35em;text-indent:.35em;font-weight:600;margin-bottom:8px}
  .win p{color:var(--dim);font-size:11px;letter-spacing:.08em;margin-bottom:18px}
  .win button{background:transparent;border:1px solid var(--line2);border-radius:6px;color:var(--accent);
    font-family:inherit;font-size:12px;letter-spacing:.2em;padding:10px 26px;cursor:pointer;transition:border-color .45s ease}
  .win button:hover{border-color:var(--ok)}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="../march-story/frame-report.js?v=8e3f525cf5eb53e3"></script>
</head>
<body>
<div class="shell">
  <div class="shell-head"><span><b>EXP-03</b> · 对弈终端</span><span>TIC-TAC-PROT.</span></div>
  <div class="stage">
    <span class="corner tl">SMP-3×3</span><span class="corner br">OPP:AUTO</span>
    <p class="brief">你执 ✕ 先手 · 终端执 ○ · 赢得对局才放行</p>
    <div class="status" id="status">轮到你了，点一个格子。</div>
    <div class="board" id="board"></div>
  </div>
  <div class="shell-foot">
    <button class="sbtn" id="resetAll">重置实验</button>
    <a class="sbtn" id="backLab" href="index.html">返回档案室</a>
    <button class="sbtn" id="helpBtn">帮助</button>
  </div>
</div>
<div class="overlay" id="overlay"><div class="win"><h2>PLAYER WINS</h2><p>对局校验通过 · 终端放行 · 已通知主线</p><button id="close">继续</button></div></div>
<script>
'use strict';
/* 井字棋人机对战：玩家 ✕ 先手，AI ○ 基础难度（抢胜 → 堵截 → 中心 → 角 → 边）。
   仅玩家获胜时 postMessage('tictac_success') 通知父页面。 */
const KEY='tictac_success';
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const board=document.getElementById('board'),statusEl=document.getElementById('status'),overlay=document.getElementById('overlay');
let cells=[],state,over;

function setStatus(t,c){statusEl.textContent=t;statusEl.className='status'+(c?' '+c:'');}
function lineOf(p){for(const L of LINES)if(state[L[0]]===p&&state[L[1]]===p&&state[L[2]]===p)return L;return null;}
function render(){cells.forEach((c,i)=>{c.textContent=state[i]==='X'?'✕':state[i]==='O'?'○':'';c.classList.toggle('o',state[i]==='O');c.disabled=over||!!state[i];});}
function finish(winner,line){
  over=true;render();
  if(line)line.forEach(i=>cells[i].classList.add('hl'));
  if(winner==='X'){ // 只有玩家获胜才发通关信号
    setStatus('你赢了！','win');
    overlay.classList.add('show');
    try{window.CZMarchFrameReport(KEY);}catch(_){}
  }else if(winner==='O')setStatus('终端赢了 · 再试一次','lose');
  else setStatus('平局 · 不分胜负');
}
function afterMove(){
  const l=lineOf('X');if(l)return finish('X',l);
  const lo=lineOf('O');if(lo)return finish('O',lo);
  if(state.every(v=>v))return finish(null,null);
  return false;
}
function pick(p){ // 找到能让 p 一手取胜的格子
  for(const L of LINES){const v=L.map(i=>state[i]);
    if(v.filter(x=>x===p).length===2&&v.includes(''))return L[v.indexOf('')];}
  return -1;
}
function aiMove(){
  let m=pick('O'); // 1) 抢胜
  if(m<0)m=pick('X'); // 2) 堵截
  if(m<0&&!state[4])m=4; // 3) 中心
  if(m<0){const cs=[0,2,6,8].filter(i=>!state[i]);if(cs.length)m=cs[Math.floor(Math.random()*cs.length)];} // 4) 角
  if(m<0){const ss=[1,3,5,7].filter(i=>!state[i]);if(ss.length)m=ss[Math.floor(Math.random()*ss.length)];} // 5) 边
  state[m]='O';render();
  if(!afterMove())setStatus('轮到你了。');
}
function playerMove(i){
  if(over||state[i])return;
  state[i]='X';render();
  if(afterMove())return;
  setStatus('终端运算中…');
  setTimeout(aiMove,320);
}
function build(){
  state=Array(9).fill('');over=false;
  board.replaceChildren();cells=[];
  for(let i=0;i<9;i++){const c=document.createElement('button');c.className='cell';c.addEventListener('click',()=>playerMove(i));board.append(c);cells.push(c);}
  render();setStatus('轮到你了，点一个格子。');
}
document.getElementById('resetAll').addEventListener('click',build);
document.getElementById('close').addEventListener('click',()=>overlay.classList.remove('show'));
document.getElementById('helpBtn').addEventListener('click',()=>setStatus('三点连成一线即获胜；终端会堵截，制造双威胁是关键'));
if(window.parent!==window)document.getElementById('backLab').remove(); // iframe 内由父页面控制导航
build();
/* 自动化/父页面测试钩子 */
window.__czTest={win:()=>finish('X',[0,1,2]),build};
</script>
</body>
</html>
