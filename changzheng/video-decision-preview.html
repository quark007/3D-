<!doctype html><html lang="zh-CN"><head><script src="js/mobile-compat.js?v=f321202ffa2b340f"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长征·星火 · 决策视频验证</title><link rel="stylesheet" href="css/decision-cinema.css?v=f04fe5f868155bc9"><style>body{margin:0;background:#102027;color:#ead8b4;font:16px/1.8 system-ui}main{max-width:800px;margin:40px auto;padding:24px}h1{font:30px SimSun,serif}a{color:#e1bc7f}select,textarea,button{box-sizing:border-box;font:inherit;padding:12px;background:#25373c;color:#f1dfbd;border:1px solid #a28b60;border-radius:6px}select,textarea{width:100%;margin:12px 0}textarea{min-height:140px}button{background:#843e30;cursor:pointer}#status{font-size:14px;color:#d4c2a4}</style><link rel="stylesheet" href="css/cinema-ui.css?v=c5ba9103a3d7dd80"><link rel="stylesheet" href="css/immersive-ui.css?v=4e68976a59b05a57"><script defer src="js/immersive-view.js?v=fe3e6ecc07ca4b3e"></script><link rel="stylesheet" href="css/documentary92.css?v=25c2de3f47913f2e"></head><body><main><a href="index.html">返回长征·星火</a><h1>决策视频 · 接入验证</h1><p>选择章节，输入行动，核对视频匹配与在线播放。此页不执行游戏任务，也不改变存档。</p><label for="chapter">当前章节</label><select id="chapter"></select><label for="command">自定义行动方案</label><textarea id="command">先清点口粮和饮水，再与战友分担物资，保持前后组联络。</textarea><label for="kind">触发方式</label><select id="kind"><option value="custom_decision">自定义决策 · DeepSeek 检索</option><option value="fixed_decision">固定决策 · 剧情映射</option><option value="custom_dialogue">自由对话 · DeepSeek 检索</option><option value="fixed_dialogue">固定对话 · 剧情映射</option></select><button id="play">匹配并播放</button><p id="status" role="status">正在读取视频目录…</p></main><script src="js/bff-config.js?v=7a9e2cd5e6f5b6c9"></script><script>const API_BASE=String(window.CZ_API_BASE).replace(/\/$/,'');const GameState={character:{id:'logistics'},recordStrategicDecision(){}};</script><script src="js/decision-cinema-core.js?v=3876eb69bc8c476f"></script><script src="js/decision-cinema.js?v=cc26b5630e50cb9c"></script><script>
const names=['中央苏区出发','湘江战役','遵义会议','四渡赤水','金沙江','大渡河','泸定桥','雪山','草地','腊子口','吴起镇','会师'];names.forEach((name,i)=>{const o=document.createElement('option');o.value=i+1;o.textContent=name;document.getElementById('chapter').append(o);});document.getElementById('play').onclick=async()=>{const id=Number(document.getElementById('chapter').value),command=document.getElementById('command').value;document.getElementById('status').textContent=document.getElementById('kind').value.startsWith('fixed_')?'正在匹配固定剧情素材…':'DeepSeek 正在后台检索本章视频…';try{const matchResult=await DecisionCinema.emit(document.getElementById('kind').value,{nodeId:id,text:command,dedupe:false,userInitiated:true});document.getElementById('status').textContent=matchResult?`本次检索：${matchResult.mode==='model'?'DeepSeek 语义检索':matchResult.mode==='fixed'?'固定剧情映射':'本章规则降级'} · ${matchResult.clips.length}段。${matchResult.reason||''}`:document.getElementById('status').textContent;}catch(error){document.getElementById('status').textContent='视频检索暂未完成：'+error.message;}};fetch(API_BASE+'/media/catalog').then(r=>r.json()).then(d=>{document.getElementById('status').textContent=d.ready?`视频源 ${d.bucket||''} · ${d.count}个目录条目。`+(d.auth_mode==='private'?'服务端凭证已配置，播放时验证权限。':`临时授权有效至${new Date(d.expires_at).toLocaleString('zh-CN')}。`):(d.message||'视频读取授权尚未就绪。');}).catch(()=>{document.getElementById('status').textContent='BFF尚未连接，请先启动游戏服务。';});
</script></body></html>
